version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: npm
    directory: '/apps/landing'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm_apps_landing:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns: ['*']
